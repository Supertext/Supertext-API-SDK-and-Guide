name: CI

# Every SDK: static checks, unit tests (including the shared vectors in spec/),
# the conformance scenarios against the stand-in, and a package build.
# See docs/DEVELOPER.md → Tests and CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Conformance
        working-directory: .
        run: node stand-in/conformance.mjs -- node sdk/typescript/examples/conformance.mjs
      - run: npm pack --dry-run

  typescript-older-node:
    # The SDK supports Node >= 18, but its test tooling (Vitest 5) needs Node 22.12+.
    # On older Node, build the package and run the conformance scenarios against it.
    name: TypeScript runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Conformance
        run: node stand-in/conformance.mjs -- node sdk/typescript/examples/conformance.mjs

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          tools: composer
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find sdk/php -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        run: vendor/bin/phpstan analyse -c sdk/php/phpstan.neon --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit -c sdk/php/phpunit.xml.dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Conformance
        run: node stand-in/conformance.mjs -- php sdk/php/examples/conformance.php

  php-without-curl:
    # ext-curl is optional (only the built-in CurlTransport needs it): the SDK must
    # install and work with an integration's own HttpTransport when curl is missing.
    name: PHP without curl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: :curl
          coverage: none
          tools: composer
      - name: curl is not loaded
        run: |
          if php -m | grep -qi '^curl$'; then echo "curl is still loaded"; exit 1; fi
      - run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit -c sdk/php/phpunit.xml.dist

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest mypy ruff build
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict
      - run: pytest
      - run: python -m build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Conformance
        working-directory: .
        run: node stand-in/conformance.mjs -- python sdk/python/examples/conformance.py

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build sdk/dotnet -warnaserror
      - run: dotnet test sdk/dotnet --no-build
      - run: dotnet build sdk/dotnet/examples/Conformance -c Release -warnaserror
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Conformance
        run: node stand-in/conformance.mjs -- dotnet sdk/dotnet/examples/Conformance/bin/Release/net8.0/Conformance.dll
      - run: dotnet pack sdk/dotnet/src/Supertext.Sdk -c Release -o sdk/dotnet/artifacts -warnaserror

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Conformance
        run: node ../../stand-in/conformance.mjs -- java -cp target/classes examples/Conformance.java
