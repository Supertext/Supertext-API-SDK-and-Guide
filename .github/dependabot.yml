version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The SDK supports Node >= 18: types must match the oldest supported Node, and
      # the test tooling must still run on it (see docs/DEVELOPER.md → Dependency updates).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler; move to it deliberately
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # PHPUnit 12 needs PHP 8.3; the SDK supports PHP 8.1
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "nuget"
    directory: "/sdk/dotnet"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "maven"
    directory: "/sdk/java"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # JUnit 6 needs Java 17; the SDK supports Java 11
      - dependency-name: "org.junit*:*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
